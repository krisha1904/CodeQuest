<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback - CodeQuest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Header -->
  <div id="navbar-placeholder"></div>

  <main class="py-4">
    <div class="container" style="max-width: 800px;">
      
      <!-- Feedback Header Banner -->
      <div class="cq-card p-4 p-md-5 mb-4 bg-surface" style="border-left: 6px solid var(--secondary);">
        <span class="badge bg-info-subtle text-info mb-2">Platform Improvement</span>
        <h2 class="fw-extrabold mb-1">Send Us Your Feedback 💬</h2>
        <p class="text-secondary mb-0">
          Help us improve CodeQuest. Report bugs, suggest Java syllabus topics, or share your learning experience.
        </p>
      </div>

      <div class="cq-card p-4 mb-4">
        <form id="feedback-form">
          <div class="mb-3">
            <label for="fbCategory" class="form-label small fw-semibold">Feedback Category</label>
            <select class="form-select" id="fbCategory" required>
              <option value="LESSON_CONTENT">Lesson Content / Java Explanations</option>
              <option value="QUIZ_QUESTION">Quiz Question or Explanation</option>
              <option value="WEBSITE_ISSUE">Technical Website Issue / Bug</option>
              <option value="FEATURE_REQUEST">Feature Request / Gamification Suggestion</option>
              <option value="GENERAL">General Learning Feedback</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="fbSubject" class="form-label small fw-semibold">Subject / Title</label>
            <input type="text" class="form-control" id="fbSubject" placeholder="e.g. Memory diagram suggestion for Lesson 2" required>
          </div>

          <div class="mb-3">
            <label for="fbMessage" class="form-label small fw-semibold">Detailed Message</label>
            <textarea class="form-control" id="fbMessage" rows="4" placeholder="Describe your suggestion or issue clearly..." required></textarea>
          </div>

          <button type="submit" class="btn-cq btn-cq-primary w-100 py-2">Submit Feedback</button>
        </form>
      </div>

      <!-- Past Submissions History -->
      <div class="cq-card p-4">
        <h6 class="fw-bold mb-3">My Past Feedback Submissions</h6>
        <div id="feedback-history-container">
          <div class="p-3 text-muted small bg-light rounded text-center">
            Your submitted feedback and administrative responses will appear here.
          </div>
        </div>
      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAuth();

    function renderFeedbackHistory() {
      const user = Auth.getCurrentUser();
      const history = JSON.parse(localStorage.getItem("cq_feedback_" + (user?.id || "guest")) || "[]");
      const container = document.getElementById("feedback-history-container");

      if (history.length === 0) {
        container.innerHTML = `
          <div class="p-3 text-muted small bg-light rounded text-center">
            Your submitted feedback and administrative responses will appear here.
          </div>
        `;
        return;
      }

      container.innerHTML = history.map(item => `
        <div class="p-3 bg-light rounded-3 border mb-2">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <strong class="small text-dark">${item.subject}</strong>
            <span class="badge bg-secondary small">${item.status || 'SUBMITTED'}</span>
          </div>
          <p class="text-muted small mb-1">${item.message}</p>
          <div class="text-muted" style="font-size:0.75rem;">Submitted on: ${item.createdAt}</div>
        </div>
      `).join('');
    }

    document.getElementById("feedback-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const cat = document.getElementById("fbCategory").value;
      const sub = document.getElementById("fbSubject").value.trim();
      const msg = document.getElementById("fbMessage").value.trim();

      const user = Auth.getCurrentUser();
      const history = JSON.parse(localStorage.getItem("cq_feedback_" + (user?.id || "guest")) || "[]");
      history.unshift({
        category: cat,
        subject: sub,
        message: msg,
        status: "RECEIVED",
        createdAt: new Date().toLocaleDateString()
      });
      localStorage.setItem("cq_feedback_" + (user?.id || "guest"), JSON.stringify(history));

      showToast("Thank you for your feedback! Our administrative team has received it.", "success");
      document.getElementById("fbSubject").value = "";
      document.getElementById("fbMessage").value = "";
      renderFeedbackHistory();
    });

    renderFeedbackHistory();
  </script>
</body>
</html>
