<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Java Course Syllabus & Roadmap - CodeQuest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Header -->
  <div id="navbar-placeholder"></div>

  <main class="py-4">
    <div class="container">
      
      <!-- Syllabus Header Banner -->
      <div class="cq-card p-4 p-md-5 mb-4 bg-surface">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div>
            <div class="badge bg-primary mb-2">College Standard Curriculum</div>
            <h2 class="fw-extrabold mb-1">Core Java Programming Syllabus</h2>
            <p class="text-secondary mb-0">
              Structured step-by-step for university examinations, semester lab exercises, and campus placements.
            </p>
          </div>
          <div class="text-md-end">
            <div class="fs-4 fw-extrabold text-primary"><span id="passed-lessons-count">0</span> / 10 Lessons Passed</div>
            <div class="text-muted small">Passing score: &ge; 70% per topic quiz</div>
          </div>
        </div>
      </div>

      <!-- 12 Modules Accordion List -->
      <div class="accordion" id="modulesAccordion">
        <!-- Rendered dynamically from CODEQUEST_DATA.modules -->
      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const accordion = document.getElementById("modulesAccordion");

    const passedCount = CODEQUEST_DATA.lessons.filter(l => l.isCompleted).length;
    document.getElementById("passed-lessons-count").textContent = passedCount;

    CODEQUEST_DATA.modules.forEach((mod, idx) => {
      // Find lessons for this module
      const modLessons = CODEQUEST_DATA.lessons.filter(l => l.moduleId === mod.id);
      const isFirst = idx < 2; // open first two modules by default

      const item = document.createElement("div");
      item.className = "accordion-item cq-card mb-3 border";
      item.innerHTML = `
        <h2 class="accordion-header" id="heading-${mod.id}">
          <button class="accordion-button ${isFirst ? '' : 'collapsed'} bg-surface text-primary fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapse-${mod.id}">
            <div class="d-flex justify-content-between align-items-center w-100 me-3">
              <div>
                <span class="badge bg-primary-light text-primary me-2">Module ${mod.order}</span>
                <span class="text-dark">${mod.title.replace(/Module \d+: /, '')}</span>
              </div>
              <span class="badge ${mod.completedCount > 0 ? 'bg-success-light text-success' : 'bg-light text-muted'} small">
                ${mod.completedCount > 0 ? `${mod.completedCount} Completed` : 'Not Started'}
              </span>
            </div>
          </button>
        </h2>
        <div id="collapse-${mod.id}" class="accordion-collapse collapse ${isFirst ? 'show' : ''}" data-bs-parent="#modulesAccordion">
          <div class="accordion-body bg-light">
            <p class="text-muted small mb-3">${mod.description}</p>
            
            <div class="list-group">
              ${modLessons.length > 0 ? modLessons.map(les => `
                <div class="list-group-item list-group-item-action d-flex justify-content-between align-items-center p-3 rounded-3 mb-2 border">
                  <div>
                    <div class="d-flex align-items-center gap-2 mb-1">
                      <span class="badge ${les.isCompleted ? 'bg-success' : 'bg-secondary'} small">
                        ${les.isCompleted ? '✓ Completed' : 'Ready to Learn'}
                      </span>
                      <strong class="text-dark">${les.title}</strong>
                    </div>
                    <div class="text-muted small">
                      ⏱️ ${les.estimatedMinutes} mins • 10-Section College Notes • Multiple-Choice Quiz
                    </div>
                  </div>
                  <div class="d-flex gap-2">
                    <a href="lesson.html?id=${les.id}" class="btn-cq btn-cq-secondary btn-sm">Read Lesson</a>
                    <a href="quiz.html?lessonId=${les.id}" class="btn-cq btn-cq-primary btn-sm">Attempt Quiz</a>
                  </div>
                </div>
              `).join('') : `
                <div class="p-3 text-muted small bg-white rounded border">
                  Lessons in this advanced module unlock as you progress through prerequisite topics.
                  <a href="lesson.html?id=1" class="ms-2 fw-semibold">Start with Module 1 →</a>
                </div>
              `}
            </div>
          </div>
        </div>
      `;
      accordion.appendChild(item);
    });
  </script>
</body>
</html>
