<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration - CodeQuest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Dynamic Navigation Header -->
  <div id="navbar-placeholder"></div>

  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
          <div class="cq-card p-4 p-md-5 shadow-sm">
            <div class="text-center mb-4">
              <img src="assets/illustrations/flame-character.svg" alt="CodeQuest Registration" style="width: 80px; height: 80px;" class="mx-auto mb-2">
              <h3 class="fw-extrabold mb-1">Create Student Account</h3>
              <p class="text-muted small">Join CodeQuest to learn Core Java, maintain daily streaks, and prepare for semester exams</p>
            </div>

            <div id="register-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

            <form id="register-form">
              <div class="row g-3">
                <div class="col-12">
                  <label for="fullName" class="form-label fw-bold small">Full Name</label>
                  <input type="text" class="form-control" id="fullName" placeholder="Enter your full name" required autofocus>
                </div>

                <div class="col-12">
                  <label for="collegeName" class="form-label fw-bold small">College / University Name</label>
                  <input type="text" class="form-control" id="collegeName" placeholder="Enter your college or university" required>
                </div>

                <div class="col-md-6">
                  <label for="reg-username" class="form-label fw-bold small">Choose Username</label>
                  <input type="text" class="form-control" id="reg-username" placeholder="e.g. java_learner" required pattern="[a-zA-Z0-9_]{3,20}">
                  <div class="form-text small" style="font-size:0.75rem;">3-20 characters (letters, numbers, _)</div>
                </div>

                <div class="col-md-6">
                  <label for="reg-email" class="form-label fw-bold small">Email Address</label>
                  <input type="email" class="form-control" id="reg-email" placeholder="your_name@college.edu" required>
                </div>

                <div class="col-md-6">
                  <label for="reg-password" class="form-label fw-bold small">Password</label>
                  <input type="password" class="form-control" id="reg-password" placeholder="At least 6 characters" required minlength="6">
                </div>

                <div class="col-md-6">
                  <label for="reg-confirm-password" class="form-label fw-bold small">Confirm Password</label>
                  <input type="password" class="form-control" id="reg-confirm-password" placeholder="Repeat your password" required minlength="6">
                </div>

                <div class="col-12">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="terms" required checked>
                    <label class="form-check-label small text-muted" for="terms">
                      I agree to the <a href="#">Terms of Academic Honor</a> and CodeQuest platform rules.
                    </label>
                  </div>
                </div>

                <div class="col-12 mt-4">
                  <button type="submit" class="btn-cq btn-cq-primary w-100 py-2 fs-6">Create My Account</button>
                </div>
              </div>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
              <p class="small text-muted mb-2">Already have an account? <a href="login.html" class="fw-bold">Sign In</a></p>
              <p class="small text-muted mb-0">Are you an instructor? <a href="admin-setup.html" class="fw-semibold text-secondary">Setup Administrator Account →</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("register-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fn = document.getElementById("fullName").value.trim();
      const cn = document.getElementById("collegeName").value.trim();
      const un = document.getElementById("reg-username").value.trim();
      const em = document.getElementById("reg-email").value.trim();
      const p1 = document.getElementById("reg-password").value;
      const p2 = document.getElementById("reg-confirm-password").value;
      const alertBox = document.getElementById("register-alert");

      alertBox.classList.add("d-none");

      if (p1 !== p2) {
        alertBox.textContent = "Passwords do not match. Please re-enter.";
        alertBox.classList.remove("d-none");
        return;
      }

      const res = await Auth.register(fn, un, em, cn, p1);
      if (res.success) {
        showToast("Registration successful! Welcome to CodeQuest.", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);
      } else {
        alertBox.textContent = res.message || "Registration failed. Try again.";
        alertBox.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
