<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CodeQuest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- Dynamic Navigation Header -->
  <div id="navbar-placeholder"></div>

  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="cq-card p-4 p-md-5 shadow-sm">
            
            <!-- Flat Cartoon Header -->
            <div class="text-center mb-4">
              <img src="assets/illustrations/flame-character.svg" alt="CodeQuest Login" style="width: 80px; height: 80px;" class="mx-auto mb-2">
              <h3 class="fw-extrabold mb-1">Welcome Back!</h3>
              <p class="text-muted small">Log in with your registered account to continue your Java learning quest</p>
            </div>

            <div id="login-alert" class="alert alert-danger d-none py-2 small" role="alert"></div>

            <form id="login-form">
              <div class="mb-3">
                <label for="username" class="form-label fw-bold small">Username or Email Address</label>
                <input type="text" class="form-control" id="username" placeholder="Enter your username or email" required autofocus>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="password" class="form-label fw-bold small mb-0">Password</label>
                </div>
                <div class="input-group">
                  <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                  <button class="btn btn-outline-secondary" type="button" id="toggle-pw" onclick="togglePasswordVisibility()">👁️</button>
                </div>
              </div>

              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                <label class="form-check-label small text-muted" for="rememberMe">Remember me on this browser</label>
              </div>

              <button type="submit" class="btn-cq btn-cq-primary w-100 py-2 fs-6">Sign In</button>

              <!-- Quick Demo Autofill Helpers -->
              <div class="mt-4 pt-3 border-top text-center">
                <div class="small fw-semibold text-muted mb-2">⚡ Quick Sign-In Helpers:</div>
                <div class="d-flex justify-content-center gap-2 flex-wrap">
                  <button type="button" class="btn btn-sm btn-danger rounded-pill px-3 fw-bold text-white shadow-sm" onclick="fillCredentials('Krisha_1904', 'krisha123')">
                    🛡️ Sign In as Admin (Krisha_1904)
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-primary rounded-pill px-3" onclick="fillCredentials('tanmay_student', 'Password123!')">
                    🎓 Student (tanmay_student)
                  </button>
                  <a href="admin-setup.html" class="btn btn-sm btn-outline-secondary rounded-pill px-3 text-decoration-none">
                    🔑 Reset/Change Password
                  </a>
                </div>
              </div>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
              <p class="small text-muted mb-2">Don't have an account yet? <a href="register.html" class="fw-bold">Sign Up Free</a></p>
              <p class="small text-muted mb-1">Instructor / Admin setup: <a href="admin-setup.html" class="fw-bold text-primary">Setup or Recover Admin Account →</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    function togglePasswordVisibility() {
      const pw = document.getElementById("password");
      pw.type = pw.type === "password" ? "text" : "password";
    }

    function fillCredentials(u, p) {
      document.getElementById("username").value = u;
      document.getElementById("password").value = p;
      document.getElementById("login-alert").classList.add("d-none");
    }

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const u = document.getElementById("username").value.trim();
      const p = document.getElementById("password").value;
      const alertBox = document.getElementById("login-alert");
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalBtnText = submitBtn.innerHTML;

      alertBox.classList.add("d-none");
      submitBtn.disabled = true;
      submitBtn.innerHTML = `<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Connecting to live server...`;

      try {
        const res = await Auth.login(u, p);
        if (res.success) {
          showToast("Signed in successfully!", "success");
          setTimeout(() => {
            if (Auth.isAdmin()) {
              window.location.href = "admin.html";
            } else {
              window.location.href = "dashboard.html";
            }
          }, 500);
        } else {
          alertBox.innerHTML = `<div><strong>Login Failed:</strong> ${res.message || "Invalid username or password."}</div><div class="mt-2 pt-2 border-top"><a href="admin-setup.html" class="btn btn-sm btn-danger text-white fw-bold">👉 Reset Admin Password using token (codequest2026)</a></div>`;
          alertBox.classList.remove("d-none");
        }
      } catch (err) {
        alertBox.innerHTML = `<div><strong>Connection Error:</strong> ${err.message || "Server taking time to wake up."}</div><div class="mt-2 pt-2 border-top"><a href="admin-setup.html" class="btn btn-sm btn-danger text-white fw-bold">👉 Reset Admin Password using token (codequest2026)</a></div>`;
        alertBox.classList.remove("d-none");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalBtnText;
      }
    });
  </script>
</body>
</html>
