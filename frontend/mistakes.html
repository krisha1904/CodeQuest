<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mistake Notebook - CodeQuest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Header -->
  <div id="navbar-placeholder"></div>

  <main class="py-4">
    <div class="container">
      
      <!-- Mistake Notebook Header Banner -->
      <div class="cq-card p-4 p-md-5 mb-4 bg-surface" style="border-left: 6px solid var(--danger);">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div>
            <span class="badge bg-danger-light text-danger mb-2">Smart Revision Engine</span>
            <h2 class="fw-extrabold mb-1">My Mistake Notebook 📖</h2>
            <p class="text-secondary mb-0">
              Review and conquer concepts you previously missed in quizzes. Turn errors into college exam distinctions.
            </p>
          </div>
          <div class="text-md-end">
            <span class="badge bg-danger fs-6 px-3 py-2" id="unresolved-counter">0 Questions Need Revision</span>
          </div>
        </div>
      </div>

      <!-- Filter Controls -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary active" onclick="filterMistakes('all', this)">All Mistakes</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="filterMistakes('unresolved', this)">Needs Revision</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="filterMistakes('resolved', this)">Resolved</button>
        </div>
      </div>

      <!-- Mistakes Card Feed -->
      <div id="mistakes-container">
        <!-- Rendered dynamically -->
      </div>

    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAuth();

    let mistakesData = [];
    let currentFilter = 'all';

    async function loadMistakes() {
      try {
        mistakesData = await CodeQuestAPI.request("/mistakes");
        if (!Array.isArray(mistakesData)) mistakesData = [];
        renderMistakes(currentFilter);
      } catch (err) {
        console.error("Failed to load mistakes:", err);
        mistakesData = [];
        renderMistakes(currentFilter);
      }
    }

    function renderMistakes(filter = 'all') {
      currentFilter = filter;
      const container = document.getElementById("mistakes-container");
      container.innerHTML = "";

      let list = mistakesData;
      if (filter === 'unresolved') list = list.filter(m => !m.isResolved);
      if (filter === 'resolved') list = list.filter(m => m.isResolved);

      const unresolvedCount = mistakesData.filter(m => !m.isResolved).length;
      document.getElementById("unresolved-counter").textContent = `${unresolvedCount} Question${unresolvedCount === 1 ? '' : 's'} Need Revision`;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="cq-empty-state">
            <img src="assets/illustrations/empty-mistakes.svg" alt="Clean code, zero errors" class="empty-icon" style="width: 140px; height: 140px;">
            <h4 class="empty-title">Clean Slate, Zero Errors!</h4>
            <p class="empty-desc">Your Mistake Notebook is spotless. When you miss any questions in quizzes, they will be automatically preserved here with complete explanations for college exam revision.</p>
            <a href="learn.html" class="btn-cq btn-cq-primary">Practice Java Lessons</a>
          </div>
        `;
        return;
      }

      list.forEach(m => {
        const card = document.createElement("div");
        card.className = `cq-card p-4 mb-3 ${m.isResolved ? 'opacity-75' : ''}`;
        card.innerHTML = `
          <div class="d-flex justify-content-between align-items-center mb-2">
            <div>
              <span class="badge bg-secondary mb-1">${m.topic || 'Quiz Question'}</span>
              <span class="text-muted small ms-2">Missed ${m.attemptsCount || 1} time(s) • ${m.lastAttemptedAt || 'Recently'}</span>
            </div>
            ${m.isResolved ? `
              <span class="badge bg-success-light text-success fw-bold">✓ Understood</span>
            ` : `
              <button class="btn btn-sm btn-outline-success fw-bold" onclick="markResolved(${m.id})">
                ✓ Mark as Understood
              </button>
            `}
          </div>

          <h5 class="fw-bold text-dark mb-3">${m.questionText}</h5>

          <div class="row g-2 mb-3">
            <div class="col-md-6">
              <div class="p-2 rounded bg-danger-light border border-danger small">
                <strong>Your Selected Answer:</strong> Option ${m.userAnswer} (Incorrect)
              </div>
            </div>
            <div class="col-md-6">
              <div class="p-2 rounded bg-success-light border border-success small">
                <strong>Correct College Answer:</strong> Option ${m.correctOption}
              </div>
            </div>
          </div>

          <div class="callout-box tip mb-0">
            <strong>Detailed Exam Explanation:</strong>
            <p class="mb-0 small mt-1">${m.explanation}</p>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function markResolved(id) {
      await CodeQuestAPI.request(`/mistakes/${id}/resolve`, { method: "PUT" });
      const item = mistakesData.find(m => m.id === id);
      if (item) item.isResolved = true;
      showToast("Marked as understood! Removed from weak topics alert.", "success");
      renderMistakes(currentFilter);
    }

    function filterMistakes(type, btnEl) {
      if (btnEl) {
        document.querySelectorAll(".btn-outline-primary, .btn-outline-secondary").forEach(b => {
          b.className = "btn btn-sm btn-outline-secondary";
        });
        btnEl.className = "btn btn-sm btn-outline-primary active";
      }
      renderMistakes(type);
    }

    loadMistakes();
  </script>
</body>
</html>
