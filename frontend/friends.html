<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friends & Study Circle - CodeQuest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Header -->
  <div id="navbar-placeholder"></div>

  <main class="py-4">
    <div class="container">
      
      <!-- Friends Header Banner -->
      <div class="cq-card p-4 p-md-5 mb-4 bg-surface" style="border-left: 6px solid var(--primary);">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div>
            <span class="badge bg-primary-light text-primary mb-2">College Study Circle</span>
            <h2 class="fw-extrabold mb-1">Friends & Peers 👥</h2>
            <p class="text-secondary mb-0">
              Connect with university batchmates, challenge each other in Java quizzes, and track progress together.
            </p>
          </div>
          <div>
            <button class="btn-cq btn-cq-primary" data-bs-toggle="modal" data-bs-target="#addFriendModal">
              + Add New Friend
            </button>
          </div>
        </div>
      </div>

      <!-- Friends List Grid -->
      <div class="row g-3" id="friends-list-container">
        <!-- Rendered dynamically -->
      </div>

    </div>
  </main>

  <!-- Add Friend Modal -->
  <div class="modal fade" id="addFriendModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content cq-card p-3 border-0">
        <div class="modal-header border-0 pb-0">
          <h5 class="fw-bold modal-title">Add College Peer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="add-friend-form">
            <div class="mb-3">
              <label for="friendUsernameInput" class="form-label small fw-semibold">Peer Username or College Email</label>
              <input type="text" class="form-control" id="friendUsernameInput" placeholder="e.g. ananya_sharma or classmate@college.edu" required>
            </div>
            <p class="small text-muted mb-3">
              🔒 Note: Private passwords and personal records are never shared with peers.
            </p>
            <button type="submit" class="btn-cq btn-cq-primary w-100">Send Friend Request</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAuth();

    async function loadFriends() {
      try {
        let friends = await CodeQuestAPI.request("/friends");
        if (!Array.isArray(friends)) friends = [];

        const container = document.getElementById("friends-list-container");
        container.innerHTML = "";

        if (friends.length === 0) {
          container.innerHTML = `
            <div class="col-12">
              <div class="cq-empty-state">
                <img src="assets/illustrations/empty-friends.svg" alt="Find classmates" class="empty-icon" style="width: 140px; height: 140px;">
                <h4 class="empty-title">Your Study Circle is Waiting!</h4>
                <p class="empty-desc">Connect with your college batchmates to compare streak milestones, send head-to-head quiz challenges, and learn Java together.</p>
                <button class="btn-cq btn-cq-primary" data-bs-toggle="modal" data-bs-target="#addFriendModal">+ Add First Friend</button>
              </div>
            </div>
          `;
          return;
        }

        friends.forEach(f => {
          const col = document.createElement("div");
          col.className = "col-md-6 col-lg-4";
          col.innerHTML = `
            <div class="cq-card p-4 h-100 border">
              <div class="d-flex align-items-center gap-3 mb-3">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center fw-bold fs-5" style="width:48px;height:48px;">
                  ${(f.fullName || f.username || 'F').charAt(0).toUpperCase()}
                </div>
                <div>
                  <h6 class="fw-bold mb-0">${f.fullName || f.username}</h6>
                  <div class="text-muted small">@${f.username}</div>
                  <div class="text-muted small" style="font-size:0.75rem;">${f.collegeName || 'Student'}</div>
                </div>
              </div>

              <div class="d-flex justify-content-between p-2 rounded bg-light mb-3 text-center small">
                <div>
                  <div class="text-muted">Rank Level</div>
                  <strong class="text-dark">${f.levelTitle || 'Java Novice'}</strong>
                </div>
                <div class="vr"></div>
                <div>
                  <div class="text-muted">Total Points</div>
                  <strong class="text-primary">${f.totalPoints || 0} XP</strong>
                </div>
                <div class="vr"></div>
                <div>
                  <div class="text-muted">Streak</div>
                  <strong class="text-warning">🔥 ${f.currentStreak || 0}d</strong>
                </div>
              </div>

              <a href="challenges.html" class="btn btn-outline-primary btn-sm w-100 fw-semibold">
                ⚔️ Send Quiz Challenge
              </a>
            </div>
          `;
          container.appendChild(col);
        });
      } catch (err) {
        console.error("Failed to load friends:", err);
      }
    }

    document.getElementById("add-friend-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const target = document.getElementById("friendUsernameInput").value.trim();

      const modalEl = document.getElementById("addFriendModal");
      const modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();

      showToast(`Friend invitation sent to ${target}!`, "success");
      document.getElementById("friendUsernameInput").value = "";
    });

    loadFriends();
  </script>
</body>
</html>
