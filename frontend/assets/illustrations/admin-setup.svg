<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <!-- Flat Cartoon Administrator Setup Security Shield & Key -->
  <defs>
    <filter id="shield-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Sparkles -->
  <path d="M 30 35 L 32 29 L 34 35 L 40 36 L 34 38 L 32 44 L 30 38 L 24 36 Z" fill="#FDE68A" stroke="#1E293B" stroke-width="1.5" />
  <path d="M 210 40 L 212 34 L 214 40 L 220 41 L 214 43 L 212 49 L 210 43 L 204 41 Z" fill="#38BDF8" stroke="#1E293B" stroke-width="1.5" />

  <!-- Shield Base (Indigo & Sky Blue) -->
  <g transform="translate(70, 30)" filter="url(#shield-shadow)">
    <!-- Outer Shield -->
    <path d="M 50 15 
             L 95 30 
             L 95 85 
             C 95 125, 50 145, 50 145 
             C 50 145, 5 125, 5 85 
             L 5 30 Z" 
          fill="#4F46E5" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

    <!-- Inner Shield Inset -->
    <path d="M 50 25 
             L 85 37 
             L 85 82 
             C 85 115, 50 132, 50 132 
             C 50 132, 15 115, 15 82 
             L 15 37 Z" 
          fill="#38BDF8" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Golden Key (Center of Shield) -->
    <g transform="translate(32, 50)">
      <!-- Key Ring -->
      <circle cx="18" cy="18" r="16" fill="#FDE68A" stroke="#1E293B" stroke-width="3" />
      <circle cx="18" cy="18" r="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
      <!-- Key Shaft -->
      <path d="M 18 34 L 18 68" stroke="#1E293B" stroke-width="5" stroke-linecap="round" />
      <!-- Key Teeth -->
      <line x1="18" y1="52" x2="28" y2="52" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
      <line x1="18" y1="62" x2="26" y2="62" stroke="#1E293B" stroke-width="4" stroke-linecap="round" />
    </g>

    <!-- Star on Shield -->
    <path d="M 50 35 L 53 43 L 61 43 L 55 48 L 57 56 L 50 51 L 43 56 L 45 48 L 39 43 L 47 43 Z" fill="#FDE68A" stroke="#1E293B" stroke-width="1.8" />
  </g>
</svg>
