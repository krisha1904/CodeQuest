<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Flat Cartoon Quiz Thinker Character -->
  <defs>
    <filter id="think-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Floating Question Bubble -->
  <g transform="translate(130, 25)">
    <rect x="0" y="0" width="46" height="38" rx="14" fill="#FDE68A" stroke="#1E293B" stroke-width="2.5" />
    <path d="M 12 38 L 8 46 L 22 38 Z" fill="#FDE68A" stroke="#1E293B" stroke-width="2" />
    <text x="23" y="27" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#1E293B" text-anchor="middle">?</text>
  </g>

  <!-- Sparkles -->
  <path d="M 30 45 L 32 39 L 34 45 L 40 46 L 34 48 L 32 54 L 30 48 L 24 46 Z" fill="#38BDF8" stroke="#1E293B" stroke-width="1.5" />

  <!-- Character -->
  <g transform="translate(45, 60)" filter="url(#think-shadow)">
    <!-- Body -->
    <path d="M 15 80 C 15 70, 25 65, 55 65 C 85 65, 95 70, 95 80 L 100 130 L 10 130 Z" fill="#4F46E5" stroke="#1E293B" stroke-width="3.5" />
    <!-- Head -->
    <circle cx="55" cy="40" r="32" fill="#FDE68A" stroke="#1E293B" stroke-width="3.5" />
    <!-- Hair -->
    <path d="M 28 40 C 28 15, 40 10, 55 10 C 75 10, 82 18, 82 40 C 76 32, 65 26, 55 28 C 45 26, 35 32, 28 40 Z" fill="#1E293B" stroke="#1E293B" stroke-width="2.5" />
    <!-- Thinking Face: Looking upward right -->
    <circle cx="50" cy="38" r="3" fill="#1E293B" />
    <circle cx="66" cy="38" r="3" fill="#1E293B" />
    <!-- Small thoughtful mouth -->
    <path d="M 54 48 Q 58 46 62 48" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
    <!-- Rosy Cheek -->
    <circle cx="43" cy="44" r="4" fill="#FB7185" opacity="0.8" />
    <circle cx="73" cy="44" r="4" fill="#FB7185" opacity="0.8" />

    <!-- Hand on chin thinking gesture -->
    <path d="M 20 85 L 45 68 L 52 52" stroke="#1E293B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="52" cy="52" r="5" fill="#FDE68A" stroke="#1E293B" stroke-width="2" />
  </g>
</svg>
