<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <!-- Flat Cartoon Ask a Doubt Empty State -->
  <defs>
    <filter id="doubt-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Sparkles -->
  <path d="M 30 35 L 32 29 L 34 35 L 40 36 L 34 38 L 32 44 L 30 38 L 24 36 Z" fill="#FDE68A" stroke="#1E293B" stroke-width="1.5" />
  <path d="M 210 40 L 212 34 L 214 40 L 220 41 L 214 43 L 212 49 L 210 43 L 204 41 Z" fill="#38BDF8" stroke="#1E293B" stroke-width="1.5" />

  <!-- Glowing Yellow Lightbulb (Center Top) -->
  <g transform="translate(100, 20)" filter="url(#doubt-shadow)">
    <!-- Glow rays -->
    <line x1="20" y1="-8" x2="20" y2="-2" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" />
    <line x1="42" y1="2" x2="47" y2="-2" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" />
    <line x1="-2" y1="2" x2="-7" y2="-2" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" />

    <!-- Bulb Body -->
    <path d="M 8 32 C -5 20, 5 0, 20 0 C 35 0, 45 20, 32 32 L 30 42 L 10 42 Z" 
          fill="#FDE68A" stroke="#1E293B" stroke-width="3" stroke-linejoin="round" />
    <!-- Bulb Base -->
    <rect x="12" y="42" width="16" height="5" rx="1.5" fill="#E2E8F0" stroke="#1E293B" stroke-width="2" />
    <rect x="14" y="47" width="12" height="4" rx="1.5" fill="#CBD5E1" stroke="#1E293B" stroke-width="2" />

    <!-- Cute Eyes on Lightbulb -->
    <circle cx="16" cy="18" r="2.2" fill="#1E293B" />
    <circle cx="24" cy="18" r="2.2" fill="#1E293B" />
    <path d="M 18 23 Q 20 26 22 23" fill="none" stroke="#1E293B" stroke-width="1.6" stroke-linecap="round" />
  </g>

  <!-- Open Java Study Book (Center Bottom) -->
  <g transform="translate(60, 95)" filter="url(#doubt-shadow)">
    <!-- Left Page -->
    <path d="M 60 55 C 40 50, 10 50, 0 55 L 0 15 C 10 10, 40 10, 60 15 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" />
    <!-- Right Page -->
    <path d="M 60 55 C 80 50, 110 50, 120 55 L 120 15 C 110 10, 80 10, 60 15 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="3" />
    <!-- Book Spine -->
    <line x1="60" y1="15" x2="60" y2="55" stroke="#1E293B" stroke-width="3" />

    <!-- Code lines on left page -->
    <line x1="12" y1="24" x2="48" y2="24" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round" />
    <line x1="12" y1="32" x2="40" y2="32" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
    <line x1="12" y1="40" x2="45" y2="40" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

    <!-- Code lines on right page -->
    <line x1="72" y1="24" x2="108" y2="24" stroke="#FB7185" stroke-width="2.5" stroke-linecap="round" />
    <line x1="72" y1="32" x2="100" y2="32" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
    <line x1="72" y1="40" x2="95" y2="40" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
