<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <!-- Flat Cartoon Peer Challenges Empty State -->
  <defs>
    <filter id="game-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Sparkles -->
  <path d="M 30 40 L 32 34 L 34 40 L 40 41 L 34 43 L 32 49 L 30 43 L 24 41 Z" fill="#FDE68A" stroke="#1E293B" stroke-width="1.5" />
  <path d="M 210 45 L 212 39 L 214 45 L 220 46 L 214 48 L 212 54 L 210 48 L 204 46 Z" fill="#86EFAC" stroke="#1E293B" stroke-width="1.5" />

  <!-- Crossed Quiz Pennants / Flags in Background -->
  <!-- Left Flagpole -->
  <line x1="45" y1="150" x2="115" y2="50" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 115 50 L 70 75 L 105 85 Z" fill="#FB7185" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Right Flagpole -->
  <line x1="195" y1="150" x2="125" y2="50" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 125 50 L 170 75 L 135 85 Z" fill="#38BDF8" stroke="#1E293B" stroke-width="2.5" stroke-linejoin="round" />

  <!-- Cute Retro Gamepad / Quiz Controller (Center) -->
  <g transform="translate(60, 90)" filter="url(#game-shadow)">
    <!-- Gamepad Body -->
    <path d="M 25 15 
             C 10 15, 0 30, 0 50 
             C 0 75, 20 85, 35 75 
             L 50 65 
             L 70 65 
             L 85 75 
             C 100 85, 120 75, 120 50 
             C 120 30, 110 15, 95 15 Z" 
          fill="#4F46E5" stroke="#1E293B" stroke-width="3.5" stroke-linejoin="round" />

    <!-- D-Pad (Left) -->
    <rect x="22" y="32" width="16" height="6" rx="2" fill="#F8FAFC" stroke="#1E293B" stroke-width="2" />
    <rect x="27" y="27" width="6" height="16" rx="2" fill="#F8FAFC" stroke="#1E293B" stroke-width="2" />

    <!-- Buttons (Right - Yellow & Coral) -->
    <circle cx="95" cy="35" r="5" fill="#FB7185" stroke="#1E293B" stroke-width="2" />
    <circle cx="85" cy="45" r="5" fill="#FDE68A" stroke="#1E293B" stroke-width="2" />

    <!-- Center VS Badge -->
    <rect x="52" y="32" width="16" height="12" rx="4" fill="#86EFAC" stroke="#1E293B" stroke-width="1.8" />
    <text x="60" y="42" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#1E293B" text-anchor="middle">VS</text>
  </g>
</svg>
