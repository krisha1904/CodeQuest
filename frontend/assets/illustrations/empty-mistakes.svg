<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%">
  <!-- Flat Cartoon Mistake Notebook Empty State (Clean Code) -->
  <defs>
    <filter id="notebook-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Sparkles -->
  <path d="M 35 45 L 37 39 L 39 45 L 45 46 L 39 48 L 37 54 L 35 48 L 29 46 Z" fill="#FDE68A" stroke="#1E293B" stroke-width="1.5" />
  <path d="M 205 40 L 207 34 L 209 40 L 215 41 L 209 43 L 207 49 L 205 43 L 199 41 Z" fill="#86EFAC" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="45" cy="120" r="3" fill="#38BDF8" stroke="#1E293B" stroke-width="1.5" />

  <!-- Clipboard Board Base -->
  <rect x="65" y="35" width="110" height="145" rx="12" fill="#E2E8F0" stroke="#1E293B" stroke-width="3.5" filter="url(#notebook-shadow)" />
  <!-- Clipboard Paper -->
  <rect x="75" y="45" width="90" height="125" rx="6" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />

  <!-- Top Clip -->
  <rect x="95" y="25" width="50" height="18" rx="5" fill="#38BDF8" stroke="#1E293B" stroke-width="2.5" />
  <circle cx="120" cy="34" r="3" fill="#FFFFFF" stroke="#1E293B" stroke-width="1.5" />

  <!-- Clean Checkmarks on Page -->
  <!-- Checkmark 1 -->
  <g transform="translate(88, 70)">
    <circle cx="10" cy="10" r="9" fill="#86EFAC" stroke="#1E293B" stroke-width="2" />
    <path d="M 6 10 L 9 13 L 14 7" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="28" y1="10" x2="65" y2="10" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Checkmark 2 -->
  <g transform="translate(88, 100)">
    <circle cx="10" cy="10" r="9" fill="#86EFAC" stroke="#1E293B" stroke-width="2" />
    <path d="M 6 10 L 9 13 L 14 7" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="28" y1="10" x2="60" y2="10" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Checkmark 3 -->
  <g transform="translate(88, 130)">
    <circle cx="10" cy="10" r="9" fill="#86EFAC" stroke="#1E293B" stroke-width="2" />
    <path d="M 6 10 L 9 13 L 14 7" fill="none" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="28" y1="10" x2="55" y2="10" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Cheerful Yellow Pencil -->
  <g transform="translate(170, 80) rotate(25)">
    <rect x="0" y="0" width="12" height="60" fill="#FDE68A" stroke="#1E293B" stroke-width="2" />
    <!-- Eraser -->
    <rect x="0" y="-8" width="12" height="8" rx="2" fill="#FB7185" stroke="#1E293B" stroke-width="2" />
    <!-- Tip -->
    <polygon points="0,60 12,60 6,72" fill="#E2E8F0" stroke="#1E293B" stroke-width="2" />
    <polygon points="4,68 8,68 6,72" fill="#1E293B" />
  </g>
</svg>
