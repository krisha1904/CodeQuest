<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="100%" height="100%">
  <!-- Cheerful Flat Cartoon Study Circle Empty State -->
  <defs>
    <filter id="friends-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1E293B" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Sparkles -->
  <path d="M 30 35 L 32 29 L 34 35 L 40 36 L 34 38 L 32 44 L 30 38 L 24 36 Z" fill="#FDE68A" stroke="#1E293B" stroke-width="1.5" />
  <path d="M 230 40 L 232 34 L 234 40 L 240 41 L 234 43 L 232 49 L 230 43 L 224 41 Z" fill="#FB7185" stroke="#1E293B" stroke-width="1.5" />
  <circle cx="130" cy="25" r="4" fill="#86EFAC" stroke="#1E293B" stroke-width="1.5" />

  <!-- Avatar 1 (Left - Indigo Hoodie) -->
  <g transform="translate(60, 60)" filter="url(#friends-shadow)">
    <!-- Body -->
    <path d="M 10 75 C 10 65, 20 60, 40 60 C 60 60, 70 65, 70 75 L 75 110 L 5 110 Z" fill="#4F46E5" stroke="#1E293B" stroke-width="3" />
    <!-- Head -->
    <circle cx="40" cy="35" r="26" fill="#FDE68A" stroke="#1E293B" stroke-width="3" />
    <!-- Hair -->
    <path d="M 18 35 C 18 15, 28 12, 40 12 C 55 12, 62 18, 62 35 C 58 30, 50 25, 40 28 C 30 25, 22 30, 18 35 Z" fill="#1E293B" stroke="#1E293B" stroke-width="2" />
    <!-- Face -->
    <circle cx="33" cy="34" r="2.5" fill="#1E293B" />
    <circle cx="47" cy="34" r="2.5" fill="#1E293B" />
    <path d="M 36 41 Q 40 46 44 41" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
    <!-- Waving Arm -->
    <path d="M 12 70 L -4 50" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="-4" cy="50" r="5" fill="#FDE68A" stroke="#1E293B" stroke-width="2" />
  </g>

  <!-- Avatar 2 (Right - Coral Sweater) -->
  <g transform="translate(130, 60)" filter="url(#friends-shadow)">
    <!-- Body -->
    <path d="M 10 75 C 10 65, 20 60, 40 60 C 60 60, 70 65, 70 75 L 75 110 L 5 110 Z" fill="#FB7185" stroke="#1E293B" stroke-width="3" />
    <!-- Head -->
    <circle cx="40" cy="35" r="26" fill="#FDE68A" stroke="#1E293B" stroke-width="3" />
    <!-- Hair with Cute Bun -->
    <path d="M 18 35 C 18 15, 30 12, 40 12 C 55 12, 62 18, 62 35 C 58 28, 50 24, 40 26 Z" fill="#1E293B" stroke="#1E293B" stroke-width="2" />
    <circle cx="40" cy="8" r="8" fill="#1E293B" stroke="#1E293B" stroke-width="2" />
    <!-- Face -->
    <circle cx="33" cy="34" r="2.5" fill="#1E293B" />
    <circle cx="47" cy="34" r="2.5" fill="#1E293B" />
    <path d="M 36 41 Q 40 46 44 41" fill="none" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />
    <!-- Waving Arm -->
    <path d="M 68 70 L 84 50" stroke="#1E293B" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="84" cy="50" r="5" fill="#FDE68A" stroke="#1E293B" stroke-width="2" />
  </g>

  <!-- Floating Chat Bubble with Java code -->
  <g transform="translate(100, 35)">
    <rect x="0" y="0" width="60" height="30" rx="10" fill="#FFFFFF" stroke="#1E293B" stroke-width="2.5" />
    <path d="M 20 30 L 16 38 L 28 30 Z" fill="#FFFFFF" stroke="#1E293B" stroke-width="2" />
    <!-- Small Java Brackets in bubble -->
    <text x="30" y="21" font-family="'Fira Code', monospace" font-size="14" font-weight="bold" fill="#38BDF8" text-anchor="middle">&lt;code/&gt;</text>
  </g>
</svg>
