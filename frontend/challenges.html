<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friend Quiz Challenges - CodeQuest</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Dynamic Navigation Header -->
  <div id="navbar-placeholder"></div>

  <main class="py-4">
    <div class="container">
      
      <!-- Challenges Banner -->
      <div class="cq-card p-4 p-md-5 mb-4 bg-surface" style="border-left: 6px solid var(--secondary);">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">
          <div>
            <span class="badge bg-info-subtle text-info mb-2">Friendly Competition</span>
            <h2 class="fw-extrabold mb-1">Peer Quiz Challenges ⚔️</h2>
            <p class="text-secondary mb-0">
              Compete asynchronously on identical question sets with your college friends. Fair, asynchronous, and motivating!
            </p>
          </div>
          <div>
            <button class="btn-cq btn-cq-primary" data-bs-toggle="modal" data-bs-target="#createChallengeModal">
              + Challenge a Friend
            </button>
          </div>
        </div>
      </div>

      <!-- Challenge List -->
      <div class="row g-3" id="challenges-list-container">
        <!-- Injected dynamically -->
      </div>

    </div>
  </main>

  <!-- Create Challenge Modal -->
  <div class="modal fade" id="createChallengeModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content cq-card p-3 border-0">
        <div class="modal-header border-0 pb-0">
          <h5 class="fw-bold modal-title">⚔️ Create Friend Challenge</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="create-challenge-form">
            <div class="mb-3">
              <label for="challengeFriendSelect" class="form-label small fw-semibold">Select Friend</label>
              <select class="form-select" id="challengeFriendSelect" required>
                <!-- Filled dynamically -->
              </select>
            </div>
            <div class="mb-3">
              <label for="challengeLessonSelect" class="form-label small fw-semibold">Select Topic Quiz</label>
              <select class="form-select" id="challengeLessonSelect" required>
                <!-- Filled dynamically -->
              </select>
            </div>
            <div class="small text-muted p-2 bg-light rounded mb-3">
              📌 Both participants attempt the same 5 MCQs independently. Scores are compared upon completion!
            </div>
            <button type="submit" class="btn-cq btn-cq-primary w-100" id="send-challenge-submit-btn">Send Challenge Invitation</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    Auth.requireAuth();

    async function loadChallenges() {
      try {
        let list = await CodeQuestAPI.request("/challenges");
        if (!Array.isArray(list)) list = [];

        const container = document.getElementById("challenges-list-container");
        container.innerHTML = "";

        if (list.length === 0) {
          container.innerHTML = `
            <div class="col-12">
              <div class="cq-empty-state">
                <img src="assets/illustrations/empty-challenges.svg" alt="No challenges yet" class="empty-icon" style="width: 140px; height: 140px;">
                <h4 class="empty-title">Ready for Your First Quiz Match?</h4>
                <p class="empty-desc">Send asynchronous quiz challenges to classmates. Both answer the same 5 Java MCQs and compare scores on the leaderboard!</p>
                <button class="btn-cq btn-cq-primary" data-bs-toggle="modal" data-bs-target="#createChallengeModal">+ Challenge a Friend</button>
              </div>
            </div>
          `;
        } else {
          list.forEach(c => {
            const col = document.createElement("div");
            col.className = "col-md-6";
            const isWon = c.winnerName && c.winnerName.includes("You");

            col.innerHTML = `
              <div class="cq-card p-4 h-100 border">
                <div class="d-flex justify-content-between align-items-center mb-2">
                  <span class="badge ${c.status === 'COMPLETED' ? 'bg-success' : 'bg-warning text-dark'} small">
                    ${c.status}
                  </span>
                  <span class="text-muted small">${c.createdAt || 'Recently'}</span>
                </div>

                <h5 class="fw-bold mb-1">${c.lessonTitle || 'Java Topic Assessment'}</h5>
                <div class="text-muted small mb-3">${c.creatorName || 'You'} vs. ${c.opponentName || 'Classmate'}</div>

                <div class="p-3 bg-light rounded-3 mb-3 d-flex justify-content-around text-center">
                  <div>
                    <div class="small text-muted">Your Score</div>
                    <div class="fs-4 fw-extrabold ${c.myScore !== null ? 'text-primary' : 'text-muted'}">
                      ${c.myScore !== null ? `${c.myScore}%` : 'Not Attempted'}
                    </div>
                  </div>
                  <div class="vr"></div>
                  <div>
                    <div class="small text-muted">Friend's Score</div>
                    <div class="fs-4 fw-extrabold text-secondary">
                      ${c.opponentScore !== null ? `${c.opponentScore}%` : 'Pending'}
                    </div>
                  </div>
                </div>

                ${c.status === 'PENDING' && c.myScore === null ? `
                  <a href="quiz.html?lessonId=${c.lessonId}&challengeId=${c.id}" class="btn-cq btn-cq-primary btn-sm w-100">
                    🎯 Accept & Attempt Quiz Now
                  </a>
                ` : `
                  <div class="text-center small fw-semibold ${isWon ? 'text-success' : 'text-muted'}">
                    ${c.winnerName ? `🏆 Winner: ${c.winnerName}` : 'Match In Progress'}
                  </div>
                `}
              </div>
            `;
            container.appendChild(col);
          });
        }

        // Populate Modal options
        const friendRecords = JSON.parse(localStorage.getItem("cq_friends_" + (Auth.getCurrentUser()?.id || "guest")) || "[]");
        const friendSelect = document.getElementById("challengeFriendSelect");
        if (friendRecords.length > 0) {
          friendSelect.innerHTML = friendRecords.map(f => `
            <option value="${f.id}">${f.fullName || f.username} (@${f.username})</option>
          `).join('');
          document.getElementById("send-challenge-submit-btn").disabled = false;
        } else {
          friendSelect.innerHTML = `<option value="">No friends added yet. Add peers in Friends first!</option>`;
          document.getElementById("send-challenge-submit-btn").disabled = true;
        }

        const lessonSelect = document.getElementById("challengeLessonSelect");
        lessonSelect.innerHTML = CODEQUEST_DATA.lessons.map(l => `
          <option value="${l.id}">${l.id}. ${l.title}</option>
        `).join('');

      } catch (err) {
        console.error("Failed to load challenges:", err);
      }
    }

    document.getElementById("create-challenge-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const friendId = parseInt(document.getElementById("challengeFriendSelect").value);
      const lessonId = parseInt(document.getElementById("challengeLessonSelect").value);

      if (!friendId) {
        showToast("Please add a friend first to send challenges!", "warning");
        return;
      }

      await CodeQuestAPI.request("/challenges", {
        method: "POST",
        body: JSON.stringify({ friendId, lessonId })
      });

      const modalEl = document.getElementById("createChallengeModal");
      const modal = bootstrap.Modal.getInstance(modalEl);
      if (modal) modal.hide();

      showToast("Challenge sent to your friend! Waiting for quiz attempt.", "success");
      loadChallenges();
    });

    loadChallenges();
  </script>
</body>
</html>
