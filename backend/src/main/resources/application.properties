# =====================================================================
# CodeQuest: Spring Boot Application Properties
# =====================================================================

server.port=8080

# Application Name
spring.application.name=codequest-backend

# Default Profile: dev (H2 embedded with automatic seed data)
# To switch to MySQL for production or workbench: set spring.profiles.active=mysql
spring.profiles.active=dev

# Common Jackson Settings
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false

# JWT Secret & Expiration (24 hours)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expirationMs=86400000

# File Upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
